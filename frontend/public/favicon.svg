<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="f-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="f-pupil" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Eye lens -->
  <path d="M 6,32 C 20,19 44,19 58,32 C 44,45 20,45 6,32 Z"
        stroke="#2CE8C6" stroke-width="2" filter="url(#f-glow)"/>

  <!-- Slit pupil -->
  <path d="M 32,21 C 35.5,26 35.5,38 32,43 C 28.5,38 28.5,26 32,21 Z"
        fill="#2CE8C6" filter="url(#f-pupil)"/>
</svg>
