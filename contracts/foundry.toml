[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Separate profile for compiling the Honk verifier without via_ir interference.
# Usage: FOUNDRY_PROFILE=verifier forge build
[profile.verifier]
src = "src"
out = "out"
libs = ["lib"]
via_ir = false
optimizer = true
optimizer_runs = 200

# Size-optimised profile for deploying HonkVerifier (28 KB → fits under 24 KB limit).
# optimizer_runs=1 shrinks bytecode at the cost of higher per-call gas — acceptable for
# a verifier called once per batch settlement.
# Usage: FOUNDRY_PROFILE=size forge script script/DeployAmoyHonk.s.sol ...
[profile.size]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 1
