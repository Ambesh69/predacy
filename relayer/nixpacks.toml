# Skip tsc (build) — tsx executes TypeScript directly at runtime.
# Nixpacks would otherwise run `npm run build` which fails on strict
# viem generic inference that tsx handles fine at runtime.
#
# bb (Barretenberg) native binary: NO separate install needed.
# @aztec/bb.js bundles its own version-matched bb binary inside the npm package
# (node_modules/@aztec/bb.js/build/<platform>/bb). zkProver.ts calls
# Barretenberg.new({}) with no bbPath so bb.js auto-discovers the bundled binary.
# This avoids the mismatch where bbup-installed ~/.bb/bb can be a different version
# that exits with code 1 during proof generation.

[phases.build]
cmds = [
  "npm install --no-audit --no-fund",
]

[start]
cmd = "npm start"
