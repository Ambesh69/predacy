# tsx executes TypeScript directly at runtime. Type checking is run separately
# with `npm run build`; the deploy build only needs to install dependencies.
#
# bb (Barretenberg) native binary: NO separate install needed.
# @aztec/bb.js bundles its own version-matched bb binary inside the npm package
# (node_modules/@aztec/bb.js/build/<platform>/bb). zkProver.ts calls
# Barretenberg.new({}) with no bbPath so bb.js auto-discovers the bundled binary.
# This avoids the mismatch where bbup-installed ~/.bb/bb can be a different version
# that exits with code 1 during proof generation.
#
# Ubuntu 24.04 required: the bundled bb binary in @aztec/bb.js@4.0.0-nightly needs
# glibc >= 2.38 (libm) and 2.39 (libc) + GLIBCXX_3.4.31/32 (libstdc++).
# Nixpacks defaults to Ubuntu 22.04 (glibc 2.35) which causes "exit code 1" at
# proof generation time. Ubuntu 24.04 ships glibc 2.39 and GLIBCXX_3.4.32.
# zkProver.ts also has a WASM fallback in case the native binary still fails.

[variables]
NIXPACKS_UBUNTU_VERSION = "24.04"
NIXPACKS_NODE_VERSION = "24"

[phases.build]
cmds = [
  "npm install --no-audit --no-fund",
]

[start]
cmd = "npm start"
